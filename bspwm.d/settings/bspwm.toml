# initialize the bspwm config
############################################################ CONFIG ##########################################################################
[config]
_name    = "bspwm"
# define the name of the window
_path    = "$HOME/.config/bspwm/bspwm.d/sources/bspwm.sh"
# define the source sh path
_root    = "$HOME/.config/bspwm"
# define the root dir
_desc    = "Core WM settings: borders, windows, tiling scheme"
# define the description
_exports = "$HOME/.config/bspwm/bspwm.d/exports.sh"
# define exports to be exported in bspwm.sh

########################################################## RELOAD ##############################################################################
[config._reload]
command = "bspc wm -r"
# what is the config reload command?

########################################################## BORDERS #############################################################################
[config.borders]
enabled = true
style   = "solid"
[[config.borders.true]]
focused_color = "#414868"
normal_color  = "#1e1e2e"
active_color  = "#000000"
width         = 2
[[config.borders.false]]
width = 0

#----------------------------------------------------------------[rules for borders]
[config.borders._rules]
style.enum        = ["solid", "dashed", "dotted", "none"]
style.desc        = "Border rendering style"
style.label       = "Border Style"
true.focused_color.label = "Focused Color"
true.normal_color.label  = "Normal Color"
true.active_color.label  = "Active Color"
true.width.label         = "Border Width"
true.width.range  = { upper = 15.0, lower = 1.0 }
false.width.label        = "Border Width"
false.width.range = { upper = 0.90, lower = 0.0 }

####################################################### PRESELECTION ###########################################################################
[config.presel]
enabled = false
[[config.presel.true]]
pfc = "#6272a4"
[[config.presel.false]]
pfc = "#000000"

#----------------------------------------------------------------[rules for preselection]
[config.presel._rules]
true.pfc.label = "Preselection Color"
true.pfc.desc  = "The color for preselection identification"
false.pfc.label = "Preselection Color"
false.pfc.desc  = "The color for preselection identification"

###################################################### WINDOWS #################################################################################
[config.window]
sr_ratio = 0.5
# this is status prefix for bspwm
prefix   = ""

#---------------------------------------------------------------[rules for window]
[config.window._rules]
sr_ratio.range = { lower = 0.10, upper = 0.90 }
sr_ratio.step  = 0.05
sr_ratio.label = "Split Ratio"
sr_ratio.desc  = "Initial split ratio for new windows (0.10 – 0.90)"
prefix.kind    = "command"
prefix.label   = "Status Prefix"
prefix.desc    = "Command prefix prepended to window rules"

# window gaps : is the window gapped?
[config.window.gapped]
enabled = true
# what should be the gap if it is gapped?
[[config.window.gapped.true]]
gap = 10
# if not gapped?
[[config.window.gapped.false]]
gap = 0

#------------------------------------------------------------[rules for gaps]
[config.window.gapped._rules]
true.gap.range  = { lower = 0, upper = 60 }
true.gap.label  = "Window Gap"
true.gap.unit   = "px"
true.gap.desc   = "Pixel gap between tiled windows when enabled."
false.gap.label = "Window Gap"
false.gap.range = { lower = 0, upper = 10 }
false.gap.unit  = "px"
false.gap.desc  = "Pixel gap between tiled windows when disabled."

# is the window padded?
[config.window.padded]
enabled = false
# values when the window is padded
[[config.window.padded.true]]
top    = 10
bottom = 10
left   = 10
right  = 10
# values when the window is not padded
[[config.window.padded.false]]
top    = 0
bottom = 0
left   = 0
right  = 0

#----------------------------------------------------[rules for padded windows]
[config.window.padded._rules]
true.top.label    = "Top Padding"
true.bottom.label = "Bottom Padding"
true.left.label   = "Left Padding"
true.right.label  = "Right Padding"
false.top.label    = "Top Padding"
false.bottom.label = "Bottom Padding"
false.left.label   = "Left Padding"
false.right.label  = "Right Padding"

# config for automatic scheme
[config.scheme.automatic]
enabled = true
[[config.scheme.automatic.true]]
scheme           = "spiral"
initial_polarity = "second_child"
[[config.scheme.automatic.false]]
scheme           = "longest_side"
initial_polarity = "second_child"

#-----------------------------------------------------------------[rules for automatic scheme]
[config.scheme.automatic._rules]
true.scheme.enum            = ["spiral", "alternate", "longest_side"]
true.scheme.desc            = "Tiling scheme used when automatic mode is on"
# ah labeling is a tedious process 
true.scheme.label = "Automatic Scheme"
true.initial_polarity.enum  = ["first_child", "second_child"]
true.initial_polarity.desc  = "Which child node receives focus on split"
true.initial_polarity.label = "Initial Polarity"
false.scheme.enum           = ["alternate", "longest_side"]
false.scheme.desc           = "Tiling scheme used when automatic mode is off"
false.scheme.label = "Automatic Scheme"
false.initial_polarity.enum = ["first_child", "second_child"]
false.initial_polarity.label = "Initial Polarity"


# Configuration Settings for Monocle
[config.monocle]
borderless = false
gapless    = false
single     = false

#-------------------------------------------------------[rules for monocle]
[config.monocle._rules]
borderless.label = "No Border"
gapless.label    = "No Gap"
single.label     = "No Single Window"

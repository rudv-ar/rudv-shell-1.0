################################################# CONFIG FOR NETWORK ##########################################################################
[config]
_name = "net"
_path = "$HOME/.config/bspwm/bspwm.d/sources/network.sh"
_desc = "Network interfaces, Tor, firewall settings"

################################################## RELOAD COMMAND ############################################################################
[config._reload]
command = "systemctl restart NetworkManager"

[config.network]
# the variable prefix for network when output in sh file
_prefix = "net"
enabled = true
timeout = 30
retry   = 3

[config.network._rules]
timeout.range = { lower = 1, upper = 120 }
timeout.unit  = "s"
timeout.desc  = "Seconds before a connection attempt times out"

# the labels
timeout.label = "Retry Timeout"
retry.range   = { lower = 0, upper = 10 }
retry.desc    = "Number of reconnection attempts before giving up"
retry.label   = "Retry Number"

[config.network.wifi]
enabled = true
driver  = "iwlwifi"
[[config.network.wifi.true]]
interface = "wlan0"
[[config.network.wifi.true]]
interface = "wlan1"
[[config.network.wifi.false]]
interface = "wlan2"

[config.network.wifi._rules]
driver.enum  = ["iwlwifi", "ath9k", "rtl8xxxu", "brcmfmac"]
driver.desc  = "Kernel WiFi driver module"
driver.label = "Driver"

[config.network.tor]
enabled    = true
proxy_port = 9050
[[config.network.tor.true]]
torinstance = "$HOME/.config/bspwm/apps/tor-instance"
torrc       = "$HOME/.config/bspwm/apps/tor-instance/torrc"
torlogs     = "$HOME/.config/bspwm/apps/tor-instance/logs"
torerrors   = "$HOME/.config/bspwm/apps/tor-instance/errors/"
[[config.network.tor.false]]
torrc = "/etc/tor/torrc"

[config.network.tor._rules]
proxy_port.range = { lower = 1024, upper = 65535 }
proxy_port.desc  = "Local SOCKS5 proxy port exposed by Tor"
proxy_port.label = "Proxy Port"
true.torinstance.label = "Tor Directory"
true.torrc.label       = "Tor Config"
true.torlogs.label     = "Log Directory"
true.torerrors.label   = "Error Directory"
false.torrc.label      = "Fallback Config"

[config.network.ethernet]
enabled = true
mac     = "aa:bb:cc:dd:ee:ff"
[[config.network.ethernet.true]]
interface = "eth0"

[config.network.ethernet._rules]
mac.readonly = true
mac.desc     = "Hardware MAC address (read-only)"
mac.label    = "MAC Address"

[config.network.firewall]
enabled   = true
backend   = "ufw"
log_level = "warn"
[[config.network.firewall.true]]
rules = "/etc/firewall.rules"

[config.network.firewall._rules]
backend.enum    = ["nftables", "iptables", "ufw", "firewalld"]
backend.desc    = "Firewall backend to configure on startup"
backend.label   = "Firewall Backend"
log_level.enum  = ["debug", "info", "warn", "error", "off"]
log_level.desc  = "Verbosity of firewall log output"
log_level.label = "Log Level"
true.rules.label = "Firewall Rules"

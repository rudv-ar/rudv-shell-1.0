[config]
_name = "widget"
_path = "$HOME/.config/bspwm/bspwm.d/sources/widget.sh"
_desc = "Status bar and desktop widget settings"

[config._reload]
command = "pkill -x quickshell; quickshell &"

[config.widget]
_prefix = "widget"
enabled = true
bar     = "quickshell"

[config.widget._rules]
bar.enum  = ["quickshell", "polybar", "waybar", "eww", "none"]
bar.desc  = "Status bar to launch on startup"
bar.label = "Bar"

